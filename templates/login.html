<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberBackup - {{ hostname }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center position-relative" style="min-height: 100vh;">

<!-- SELECTOR DE IDIOMA -->
<div class="position-absolute top-0 end-0 p-3">
    <div class="dropdown">
        <button class="btn btn-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
            <i class="fas fa-globe me-1"></i> {{ current_lang | upper }}
        </button>
        <ul class="dropdown-menu dropdown-menu-dark">
            <li><a class="dropdown-item" href="{{ url_for('set_lang', lang_code='es') }}">Español</a></li>
            <li><a class="dropdown-item" href="{{ url_for('set_lang', lang_code='en') }}">English</a></li>
            <li><a class="dropdown-item" href="{{ url_for('set_lang', lang_code='it') }}">Italiano</a></li>
            <li><a class="dropdown-item" href="{{ url_for('set_lang', lang_code='eo') }}">Esperanto</a></li>
            <li><a class="dropdown-item" href="{{ url_for('set_lang', lang_code='ru') }}">Русский</a></li>
            <li><a class="dropdown-item" href="{{ url_for('set_lang', lang_code='ja') }}">日本語</a></li>
            <li><a class="dropdown-item" href="{{ url_for('set_lang', lang_code='zh') }}">中文</a></li>
        </ul>
    </div>
</div>

<div class="card shadow-lg border-0" style="width: 100%; max-width: 420px;">
    <div class="card-header bg-primary text-white text-center py-3">
        <h4 class="mb-0"><i class="fas fa-shield-halved me-2"></i>CyberBackup</h4>
        <small>Server: <strong>{{ hostname }}</strong></small>
    </div>
    <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label fw-bold">{{ t.user }}</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">{{ t.pass }}</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="fas fa-right-to-bracket me-1"></i> {{ t.enter }}
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
